[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opmlark"
version = "0.1.0"
description = "Watch OPML feeds and preserve new articles as clean Markdown."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["opml", "rss", "atom", "markdown", "defuddle", "obsidian"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: News/Diary",
]

[project.urls]
Homepage = "https://github.com/imhalawa/opmlark"
Issues = "https://github.com/imhalawa/opmlark/issues"
Changelog = "https://github.com/imhalawa/opmlark/blob/master/CHANGELOG.md"

[project.scripts]
opmlark = "article_importer.cli:main"

[tool.setuptools.packages.find]
include = ["article_importer*"]
